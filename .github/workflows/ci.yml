name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  macos:
    name: macOS checks
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcode-select -p
          xcodebuild -version
          swift --version

      - name: Verify bundled ExifTool
        run: ./Scripts/verify-vendor.sh

      - name: Swift format
        run: ./Scripts/format-check.sh

      - name: Core tests
        run: swift test --package-path RawGeoCore

      - name: Metadata tests
        run: swift test --package-path MetadataInfrastructure

      - name: Application build
        run: |
          xcodebuild \
            -project RawGeoSync.xcodeproj \
            -scheme RawGeoSync \
            -configuration Debug \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath .local/CI-DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build
